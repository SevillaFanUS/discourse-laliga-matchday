plugins:
  laliga_matchday_enabled:
    client: true
    default: false

  laliga_matchday_api_key:
    client: false
    secret: true
    default: ""

  laliga_matchday_category_id:
    client: false
    type: category
    default: ""

  laliga_matchday_competition_code:
    client: false
    default: "PD"

  laliga_matchday_season:
    client: false
    default: ""

  laliga_matchday_team_id:
    client: false
    default: "559"

  laliga_matchday_post_preview:
    client: false
    default: true

  laliga_matchday_post_review:
    client: false
    default: true

  laliga_matchday_preview_hours_before:
    client: false
    default: 48
    min: 1
    max: 336

  laliga_matchday_timezones:
    client: false
    default: "Europe/Madrid,America/New_York,America/Los_Angeles"

  laliga_matchday_standings_rows:
    client: false
    default: 10
    min: 3
    max: 20

  laliga_matchday_tags:
    client: false
    default: "la-liga,matchday"

  # --- live match reporting -------------------------------------------
  laliga_live_enabled:
    client: false
    default: false

  # espn or mirror. The mirror (worldcup26.ir) republishes ESPN from its
  # own cache, and is worth having only if ESPN refuses this server.
  laliga_live_source:
    client: false
    default: "espn"

  laliga_live_league:
    client: false
    default: "esp.1"

  # ESPN team id. Sevilla FC is 243.
  laliga_live_team_id:
    client: false
    default: "243"

  # Which events get their own reply. Removing kinds makes the thread
  # quieter; adding yellow and substitution makes it much busier.
  laliga_live_announce:
    client: false
    default: "goal,own_goal,penalty_goal,penalty_missed,red,second_yellow,kickoff,half_time,full_time"

  # matchday = post into the preview topic for the round this match
  # belongs to, falling back to its own topic if there isn't one.
  # own = always create a topic per match.
  laliga_live_target:
    client: false
    default: "matchday"

  # Overrides laliga_live_target when set. Leave 0 unless you want every
  # match posted into one specific topic.
  laliga_live_topic_id:
    client: false
    default: 0

  laliga_live_tags:
    client: false
    default: "la-liga,live"

